<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="A dashboard button hands a request to the agent behind it, which does the work">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="40" y="92" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">Dashboard</text>
  <text x="40" y="114" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">figures, charts, filters</text>
  <rect x="40" y="132" width="132" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="106" y="153" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#4f46e5">Refresh report</text>
  <text x="40" y="190" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a reader presses it</text>

  <line x1="260" y1="145" x2="352" y2="145" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="306" y="133" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">managers only</text>

  <rect x="360" y="60" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="380" y="92" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The agent you named</text>
  <text x="380" y="122" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own instructions</text>
  <text x="380" y="146" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own connected apps</text>
  <text x="380" y="170" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own credits</text>
  <text x="380" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">runs like any other run</text>

  <line x1="600" y1="145" x2="692" y2="145" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="700" y="60" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="720" y="92" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The work gets done</text>
  <text x="720" y="122" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">the page is rebuilt</text>
  <text x="720" y="146" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a ticket is filed</text>
  <text x="720" y="170" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a summary is sent on</text>
  <text x="720" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">reload to see a rebuild</text>
</svg>
