<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Press a button on a dashboard, the agent behind the page does the work, and the page comes back updated">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/>
    </marker>
    <marker id="arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="40" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">Your dashboard</text>
  <text x="40" y="94" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">figures, charts, filters</text>
  <rect x="40" y="112" width="132" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="106" y="133" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#4f46e5">Refresh report</text>
  <text x="40" y="172" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">you press it</text>

  <line x1="260" y1="125" x2="352" y2="125" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="306" y="113" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">managers only</text>

  <rect x="360" y="40" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="380" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The agent you named</text>
  <text x="380" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4f46e5">can be the one that built it</text>
  <text x="380" y="126" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own instructions</text>
  <text x="380" y="150" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own connected apps</text>
  <text x="380" y="174" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own credits</text>

  <line x1="600" y1="125" x2="692" y2="125" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="700" y="40" width="240" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="720" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The work gets done</text>
  <text x="720" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">the page is rebuilt</text>
  <text x="720" y="122" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a ticket is filed</text>
  <text x="720" y="146" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a summary is sent on</text>
  <text x="720" y="174" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">credits come off that agent</text>

  <path d="M 820 210 L 820 272 L 140 272 L 140 216" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwa)"/>
  <text x="480" y="292" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4f46e5">the same page, reloaded, now up to date</text>
</svg>
