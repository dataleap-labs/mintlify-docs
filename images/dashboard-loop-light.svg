<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" role="img" aria-label="A loop between a dashboard and the agent that built it: you press the button on the page, and the same agent rebuilds that page">
  <defs>
    <marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="60" y="55" width="250" height="135" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="82" y="87" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">Your dashboard</text>
  <text x="82" y="110" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">the page you are looking at</text>
  <rect x="82" y="128" width="132" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="148" y="149" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#4f46e5">Refresh report</text>

  <rect x="470" y="55" width="250" height="135" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="492" y="87" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The agent that built it</text>
  <text x="492" y="114" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">the same agent, asked again</text>
  <text x="492" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">it makes the page again</text>

  <line x1="318" y1="100" x2="462" y2="100" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#lp)"/>
  <text x="390" y="88" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4f46e5">you press the button</text>

  <line x1="462" y1="150" x2="318" y2="150" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#lp)"/>
  <text x="390" y="170" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4f46e5">it rebuilds the page</text>
</svg>
