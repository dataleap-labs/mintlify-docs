<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" role="img" aria-label="Three kinds of agent and where each one goes before you leave: an agent that only helps you stays personal and is turned off when you leave; an agent colleagues could use becomes a template they deploy themselves; an agent that does your team's work is moved to a team, which keeps it running">
<rect width="760" height="292" fill="#1c1917"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#A5B4FC"/></marker></defs>
<rect x="24" y="24" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="124" y="54.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Only helps you</text>
<text x="124" y="74.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">your inbox, your notes</text>
<path d="M224 58.0 H274" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="24" width="200" height="68" rx="12" fill="#272a4a" stroke="#A5B4FC" stroke-width="2"/>
<text x="380" y="54.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Keep it personal</text>
<text x="380" y="74.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">nothing to do</text>
<path d="M480 58.0 H530" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="24" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="636" y="54.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Turned off</text>
<text x="636" y="74.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">when you leave</text>
<rect x="24" y="112" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="124" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Useful to colleagues</text>
<text x="124" y="162.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">for their own work</text>
<path d="M224 146.0 H274" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="112" width="200" height="68" rx="12" fill="#272a4a" stroke="#A5B4FC" stroke-width="2"/>
<text x="380" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Share as a template</text>
<text x="380" y="162.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">they deploy their own</text>
<path d="M480 146.0 H530" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="112" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="636" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Their copies</text>
<text x="636" y="162.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">stay with them</text>
<rect x="24" y="200" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="124" y="230.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Your team's work</text>
<text x="124" y="250.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">others rely on it</text>
<path d="M224 234.0 H274" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="200" width="200" height="68" rx="12" fill="#272a4a" stroke="#A5B4FC" stroke-width="2"/>
<text x="380" y="230.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Move to team</text>
<text x="380" y="250.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">the team owns it</text>
<path d="M480 234.0 H530" fill="none" stroke="#A5B4FC" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="200" width="200" height="68" rx="12" fill="#292524" stroke="#44403c"/>
<text x="636" y="230.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Keeps running</text>
<text x="636" y="250.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">for the team</text>
</svg>
