<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Model settings flow</title>
  <desc id="desc">An organization chooses a preset model and reasoning level, while enabled models appear in Customize.</desc>
  <rect width="960" height="360" rx="24" fill="#1c1917"/>
  <rect x="40" y="40" width="270" height="280" rx="18" fill="#292524" stroke="#57534e" stroke-width="2"/>
  <text x="70" y="82" fill="#fafaf9" font-family="Arial, sans-serif" font-size="22" font-weight="700">Models</text>
  <text x="70" y="116" fill="#a8a29e" font-family="Arial, sans-serif" font-size="16">Organization controls</text>
  <rect x="70" y="148" width="210" height="54" rx="12" fill="#312e81" stroke="#818cf8"/>
  <text x="175" y="181" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Basic · Pro · Expert</text>
  <rect x="70" y="222" width="210" height="54" rx="12" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="175" y="255" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Model Access</text>
  <path d="M330 180h90" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <path d="m407 168 18 12-18 12" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <rect x="440" y="40" width="230" height="280" rx="18" fill="#292524" stroke="#57534e" stroke-width="2"/>
  <text x="475" y="82" fill="#fafaf9" font-family="Arial, sans-serif" font-size="22" font-weight="700">Choose a model</text>
  <text x="475" y="116" fill="#a8a29e" font-family="Arial, sans-serif" font-size="16">For each preset</text>
  <text x="475" y="164" fill="#d6d3d1" font-family="Arial, sans-serif" font-size="16">Reasoning Level</text>
  <rect x="475" y="184" width="160" height="8" rx="4" fill="#7c3aed"/>
  <circle cx="565" cy="188" r="13" fill="#c4b5fd"/>
  <text x="475" y="228" fill="#a8a29e" font-family="Arial, sans-serif" font-size="14">Minimal · Low · Medium</text>
  <text x="475" y="252" fill="#a8a29e" font-family="Arial, sans-serif" font-size="14">High · Extra high · Max</text>
  <path d="M690 180h90" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <path d="m767 168 18 12-18 12" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <rect x="810" y="104" width="110" height="152" rx="16" fill="#292524" stroke="#57534e" stroke-width="2"/>
  <text x="865" y="146" text-anchor="middle" fill="#fafaf9" font-family="Arial, sans-serif" font-size="18" font-weight="700">Customize</text>
  <text x="865" y="180" text-anchor="middle" fill="#a8a29e" font-family="Arial, sans-serif" font-size="14">Enabled</text>
  <text x="865" y="202" text-anchor="middle" fill="#a8a29e" font-family="Arial, sans-serif" font-size="14">models</text>
  <text x="865" y="224" text-anchor="middle" fill="#a8a29e" font-family="Arial, sans-serif" font-size="14">for members</text>
</svg>
