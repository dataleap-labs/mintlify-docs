<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" role="img" aria-label="The three sharing roles, each including the one before it: Can use chats with the agent in their own chat, sees its files, reads its instructions, triggers and tools, and opens its app; Can edit also changes how it works, turns it on or off, and sees runs and everyone's chats; Can manage also changes who has access, deletes the agent and moves it">
<rect width="760" height="216" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6176F3"/></marker></defs>
<rect x="24" y="24" width="208" height="168" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>
<text x="128.0" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#292524">Can use</text>
<path d="M44 72 H212" stroke="#e7e5e4" stroke-width="1"/>
<text x="128.0" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Chats in their own chat</text>
<text x="128.0" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Sees its files</text>
<text x="128.0" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Reads instructions, triggers,</text>
<text x="128.0" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">tools; opens its app</text>
<path d="M238 108 H272" fill="none" stroke="#6176F3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="24" width="208" height="168" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>
<text x="384.0" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#292524">Can edit</text>
<path d="M300 72 H468" stroke="#e7e5e4" stroke-width="1"/>
<text x="384.0" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Everything in Can use</text>
<text x="384.0" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Changes how it works</text>
<text x="384.0" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Turns it on or off</text>
<text x="384.0" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Sees runs and all chats</text>
<path d="M494 108 H528" fill="none" stroke="#6176F3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="536" y="24" width="208" height="168" rx="12" fill="#EEF0FE" stroke="#6176F3" stroke-width="2"/>
<text x="640.0" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#292524">Can manage</text>
<path d="M556 72 H724" stroke="#e7e5e4" stroke-width="1"/>
<text x="640.0" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Everything in Can edit</text>
<text x="640.0" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Changes who has access</text>
<text x="640.0" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Deletes it</text>
<text x="640.0" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#78716c">Moves it</text>
</svg>
