<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="People you share an app with use it in their browser, and the app works with the agent's database, integrations, and agents">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect x="20" y="80" width="230" height="170" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="40" y="112" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">People you share with</text>
  <text x="40" y="136" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">named people and teams</text>
  <text x="40" y="158" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">everyone in your organization</text>
  <text x="40" y="180" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">or anyone with the link</text>
  <text x="40" y="202" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">no chat, no instructions</text>
  <line x1="250" y1="165" x2="342" y2="165" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="296" y="153" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">open it</text>
  <rect x="350" y="60" width="250" height="210" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="370" y="92" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The app</text>
  <text x="370" y="114" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">its own address, one per agent</text>
  <text x="370" y="138" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">lists, forms, charts</text>
  <rect x="370" y="156" width="112" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="426" y="177" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#4f46e5">Mark handled</text>
  <text x="370" y="216" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">built and changed in chat</text>
  <text x="370" y="240" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">published as v1, v2, v3 …</text>
  <rect x="700" y="20" width="240" height="80" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="720" y="52" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The agent's database</text>
  <text x="720" y="76" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">reads and saves rows</text>
  <rect x="700" y="125" width="240" height="80" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="720" y="157" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">The agent's integrations</text>
  <text x="720" y="181" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">current data, real actions</text>
  <rect x="700" y="230" width="240" height="80" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <text x="720" y="262" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#292524">Agents</text>
  <text x="720" y="286" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#78716c">a button asks one to run</text>
  <line x1="600" y1="165" x2="650" y2="165" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="650" y1="60" x2="650" y2="270" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="650" y1="60" x2="692" y2="60" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="650" y1="165" x2="692" y2="165" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="650" y1="270" x2="692" y2="270" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arw)"/>
</svg>
